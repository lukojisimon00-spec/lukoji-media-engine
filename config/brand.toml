# LUKOJI — kit de marque (source de vérité pour le moteur)
# Ne jamais modifier les fichiers de brand/originals : ils sont verrouillés et vérifiés par empreinte SHA-256.

[brand]
nom = "LUKOJI"
slogan = "INNOVER · CRÉER · IMPACTER"
signature_texte = "LUKOJI MEDIA"

[palette]
noir = "#0B0B0B"
blanc = "#FFFFFF"
fond_clair = "#F6F6F3"
gris_clair = "#BDBDBD"
gris = "#9A9A9A"
gris_fonce = "#555555"
jaune = "#FFD23F"          # accent motion design
orange = "#FF8A00"         # accent motion design
orange_intense = "#FF5A00" # accent motion design

[fonts]
titres = "brand/fonts/ArchivoBlack-Regular.ttf"
labels = "brand/fonts/IBMPlexMono-Regular.ttf"
labels_medium = "brand/fonts/IBMPlexMono-Medium.ttf"
labels_semibold = "brand/fonts/IBMPlexMono-SemiBold.ttf"
labels_bold = "brand/fonts/IBMPlexMono-Bold.ttf"

