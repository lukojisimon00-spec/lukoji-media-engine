# ---------------------------------------------------------------------------
# Extractions dérivées : DÉCOUPES sans retouche de pixels des originaux.
# Boîtes en pixels [x0, y0, x1, y1] (x1/y1 inclus), mesurées par segmentation alpha.
# ---------------------------------------------------------------------------
[derived.vertical_layout]
# Position des trois blocs dans vertical_slogan_* (identique en noir et blanc).
symbole = [1068, 297, 1329, 904]
logotype = [690, 1038, 1701, 1186]
slogan = [724, 1263, 1663, 1302]

# ---------------------------------------------------------------------------
# Filigrane
# ---------------------------------------------------------------------------
[watermark]
variant = "lockup"        # "lockup" = logo horizontal officiel ; "symbole" = symbole SVG seul
color_mode = "adaptive"   # "adaptive" (blanc/noir selon le fond, par segment) | "white" | "black"
opacity = 0.88
fade_in = 0.30            # secondes
shadow = "auto"           # "auto" = ombre douce sous la version blanche | "on" | "off"
shadow_opacity = 0.35
# Hystérésis de luminance (0–1) mesurée sous la zone du filigrane.
light_threshold = 0.62    # au-dessus : fond clair -> logo noir
dark_threshold = 0.50     # en dessous : fond sombre -> logo blanc
analysis_step = 0.25      # pas d'échantillonnage (s)
min_segment = 0.75        # durée minimale d'un segment de couleur (s)
avoid_padding = 16        # marge autour des zones réservées (px)
# Non-masquage : densité de contours (0–1) au-delà de laquelle la zone contient du détail
# (texte, visage, graphique). Mesurée toutes les `occlusion_step` s sur TOUTE la durée :
# une position n'est « dégagée » que si le seuil n'est JAMAIS dépassé.
# Calibrage phase 0 : fond uni/texturé ≤ 0.006 ; texte en Archivo Black ≈ 0.02.
occlusion_threshold = 0.012
occlusion_step = 0.25

[watermark.layouts.vertical]
lockup_width = 220        # px, sur une largeur de 1080
symbole_height = 120
# Ordre de préférence. Les coins bas sont ceux de la zone sûre universelle (au-dessus des
# légendes des applications) ; les sous-titres y seront déclarés comme zones réservées (phase 3).
anchors = ["top_left", "top_right", "bottom_left", "bottom_right"]

[watermark.layouts.horizontal]
lockup_width = 240        # px, sur une largeur de 1920
symbole_height = 110
anchors = ["top_right", "top_left"]   # bas exclu : contrôles du lecteur, filigrane de chaîne, écran de fin

# ---------------------------------------------------------------------------
# Signature de fin
# ---------------------------------------------------------------------------
[signature]
background = "#0B0B0B"
theme = "negatif"          # "negatif" (blanc sur noir) | "positif" (noir sur blanc)
transition = 0.25          # fondu enchaîné avec la fin du contenu (s)
audio_fade_out = 0.40      # fondu de sortie de l'audio principal (s)
min_main_duration = 12.0   # en dessous, pas de signature (format trop court)

[signature.default_by_kind]
short = "court"
documentaire = "documentaire"
affiche = "aucune"
test = "court"

[signature.presets.aucune]
duration = 0.0

[signature.presets.flash]
duration = 1.0
draw = [0.00, 0.45]
logotype = [0.30, 0.60]
slogan = false

[signature.presets.court]
duration = 1.6
draw = [0.00, 0.60]
logotype = [0.40, 0.78]
slogan = [0.62, 0.98]

[signature.presets.documentaire]
duration = 3.5
draw = [0.00, 1.10]
logotype = [0.80, 1.50]
slogan = [1.30, 2.00]

[signature.layout]
# Hauteur du logo vertical complet, en fraction de la hauteur du canevas.
vertical_canvas_fraction = 0.40
horizontal_canvas_fraction = 0.62
