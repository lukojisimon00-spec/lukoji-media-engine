# ---------------------------------------------------------------------------
# Règles de confirmation des faits (calculées, jamais déclarées).
# ---------------------------------------------------------------------------
[verification]
# Niveaux de consultation reconnus, du plus faible au plus fort.
#   resultat_recherche : titre + extrait d'un moteur de recherche (jamais une preuve)
#   page_lue_agent     : page complète lue par l'agent de lecture ; extraits rapportés mot pour mot
#   page_verifiee      : page récupérée par le moteur ; extrait retrouvé dans le texte
niveaux_probants = ["page_lue_agent", "page_verifiee"]
# Un fait est CONFIRMÉ si : 1 source A probante, OU ≥ 2 sources A/B probantes d'organisations distinctes.
# Fait d'un sujet SENSIBLE : ≥ 2 sources A/B probantes d'organisations distinctes, sans exception.
min_sources_independantes = 2
# Une source C ne confirme jamais rien.

# ---------------------------------------------------------------------------
# Score éditorial (version de formule versionnée, voir docs/SCORE_EDITORIAL.md)
# ---------------------------------------------------------------------------
[score]
version = "1.0"
# Attrait : critères éditoriaux notés 1–5 avec justification obligatoire.
poids_attrait = { potentiel_narratif = 0.22, interet_public = 0.20, originalite = 0.16, potentiel_visuel = 0.14, potentiel_hook = 0.14, pertinence_lukoji = 0.14 }
# Seuils d'alerte
solidite_min_prioritaire = 50     # en dessous : « insuffisamment documenté », non prioritaire
risque_juridique_alerte = 4       # ≥ 4 : risque élevé signalé

# ---------------------------------------------------------------------------
# Doublons : comparaison du sujet (titre + sujet + entités) ET de l'angle narratif.
# ---------------------------------------------------------------------------
[doublons]
seuil_meme_sujet = 0.55           # similarité sujet ≥ seuil -> même sujet
seuil_sujet_proche = 0.35         # sujet proche…
seuil_angle_similaire = 0.45      # …ET angle ≥ seuil -> angle trop similaire
# Corpus externes en LECTURE SEULE (contenus déjà publiés par LUKOJI ailleurs).
corpus_externes = [{ nom = "blog LUKOJI", dossier = "../lukoji-blog/articles", statut = "publie" }]
