# LUKOJI MEDIA ENGINE — recherche, sources, score éditorial, doublons (phase 1)
# Fichier public : aucun secret. Toutes les règles sont modifiables ici.

[recherche]
agent_utilisateur = "LukojiMediaEngine/0.2 (recherche editoriale)"
delai_reseau_s = 15
max_resultats_par_requete = 10
# Langues de travail (public francophone élargi, sources internationales acceptées).
langues = ["fr", "en"]

# ---------------------------------------------------------------------------
# Familles éditoriales explorées (diversité obligatoire : pas uniquement l'actualité).
# sensible = exige plusieurs sources indépendantes pour CHAQUE fait clé.
# ---------------------------------------------------------------------------
[familles]
business = { label = "Business et entrepreneuriat", sensible = false }
histoire_entreprise = { label = "Histoires d'entreprises", sensible = false }
economie = { label = "Économie", sensible = false }
tech_ia = { label = "Technologie et intelligence artificielle", sensible = false }
histoire = { label = "Histoire", sensible = false }
geopolitique = { label = "Géopolitique", sensible = true }
societe = { label = "Société", sensible = false }
geographie = { label = "Géographie", sensible = false }
personnalites = { label = "Personnalités et parcours", sensible = false }
innovation = { label = "Innovations", sensible = false }
echec_entreprise = { label = "Échecs d'entreprises", sensible = false }
scandale = { label = "Scandales documentés", sensible = true }
histoire_meconnue = { label = "Histoires méconnues", sensible = false }
culture = { label = "Phénomènes culturels", sensible = false }
decision_economique = { label = "Grandes décisions économiques", sensible = false }
reussite_faillite = { label = "Récits de réussite et de faillite", sensible = false }
enquete = { label = "Enquêtes documentaires", sensible = true }

[territoires]
valeurs = ["rdc", "afrique_centrale", "afrique_ouest", "afrique_est", "afrique_australe", "afrique_nord",
           "afrique", "europe", "ameriques", "asie", "moyen_orient", "oceanie", "monde"]

[temporalite]
valeurs = ["actualite", "tendance", "intemporel", "historique"]

# ---------------------------------------------------------------------------
# Collecteurs automatiques (découverte). Ils nécessitent un accès réseau aux hôtes
# indiqués ; si l'environnement les bloque, l'échec est journalisé (jamais simulé).
# ---------------------------------------------------------------------------
[collecteurs.wikipedia]
actif = true
langues = ["fr", "en"]
hote = "{lang}.wikipedia.org"

[collecteurs.gdelt]
actif = true
url = "https://api.gdeltproject.org/api/v2/doc/doc"
periode = "3months"

[collecteurs.rss]
actif = true
flux = [
  { nom = "RFI Afrique", url = "https://www.rfi.fr/fr/afrique/rss" },
  { nom = "Jeune Afrique", url = "https://www.jeuneafrique.com/feed/" },
  { nom = "Agence Ecofin", url = "https://www.agenceecofin.com/rss" },
  { nom = "Le Monde Afrique", url = "https://www.lemonde.fr/afrique/rss_full.xml" },
  { nom = "BBC Afrique", url = "https://feeds.bbci.co.uk/afrique/rss.xml" },
  { nom = "France 24 Afrique", url = "https://www.france24.com/fr/afrique/rss" },
  { nom = "Radio Okapi", url = "https://www.radiookapi.net/rss.xml" },
  { nom = "TechCabal", url = "https://techcabal.com/feed/" },
]

# ---------------------------------------------------------------------------
# Registre des sources : domaine -> organisation, catégorie, nature.
# A = primaire (officiel, données, rapport, publication originale, déclaration directe)
# B = secondaire fiable (média réputé, analyse documentée, ouvrage, revue spécialisée)
# C = complémentaire (blog, encyclopédie collaborative, réseau social, à confirmer)
# Un domaine absent du registre est classé C, sauf catégorie DÉCLARÉE et justifiée dans
# le dossier (signalée « à revoir » dans les propositions).
# Les suffixes (ex. "gouv.fr") couvrent tous les sous-domaines.
# plateforme = true : hébergeur de publications d'auteurs tiers (arXiv…). L'organisation retenue est alors
# l'AUTEUR déclaré (« organisation » du dossier), pour juger correctement l'indépendance des sources.
# ---------------------------------------------------------------------------
[sources.domaines]
"worldbank.org" = { org = "Banque mondiale", cat = "A", nature = "institution internationale" }
"imf.org" = { org = "Fonds monétaire international", cat = "A", nature = "institution internationale" }
"afdb.org" = { org = "Banque africaine de développement", cat = "A", nature = "institution internationale" }
