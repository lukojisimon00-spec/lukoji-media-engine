"unctad.org" = { org = "CNUCED", cat = "A", nature = "institution internationale" }
"oecd.org" = { org = "OCDE", cat = "A", nature = "institution internationale" }
"europa.eu" = { org = "Union européenne", cat = "A", nature = "institution officielle" }
