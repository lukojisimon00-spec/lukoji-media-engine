"rfi.fr" = { org = "RFI", cat = "B", nature = "média" }
"jeuneafrique.com" = { org = "Jeune Afrique", cat = "B", nature = "média" }
"agenceecofin.com" = { org = "Agence Ecofin", cat = "B", nature = "média économique" }
"lemonde.fr" = { org = "Le Monde", cat = "B", nature = "média" }
